services:
  - type: web
    name: master-ai-bot
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      # Secrets are entered in Render and never committed.
      - key: ARIAX_KEY
        sync: false
      - key: ARIAX_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # This is the only non-secret deployment override. Trading/risk values
      # use validated code defaults to prevent dashboard configuration drift.
      - key: ARIAX_BASE
        value: https://dryclean-app-1.onrender.com
      # SAFETY (v20.5): paper mode is ON. The engine runs the full pipeline
      # but sends no orders to the exchange. Change this to "false" ONLY
      # after a paper run demonstrates positive expectancy — see
      # analysis/AUDIT_v20.5.md. No strategy here is proven profitable yet.
      - key: PAPER_MODE
        value: "true"
      # Optional operator overrides (safe defaults ship in app/config.py):
      #   FUNDING_MAX_PCT (0 = gate off — testnet placeholder funding data)
      #   ENABLED_STRATEGIES / SIDES (validated default: HTF_Breakout, long)
      #   DASH_TOKEN (shared secret for the public dashboard)
      - key: ENABLED_STRATEGIES
        sync: false
      - key: SIDES
        sync: false
      - key: FUNDING_MAX_PCT
        sync: false
      - key: DASH_TOKEN
        sync: false
