services:
  - type: web
    name: master-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PHEMEX_API_KEY
        sync: false
      - key: PHEMEX_API_SECRET
        sync: false
      - key: PHEMEX_TESTNET
        value: true
      - key: DRY_RUN
        value: true
      - key: TIMEFRAME
        value: 5m
      - key: SYMBOLS
        value: BTC/USDT:USDT,ETH/USDT:USDT
      - key: RISK_PER_TRADE
        value: 1.0
      - key: MAX_DRAWDOWN
        value: 10.0
      - key: MAX_POSITIONS
        value: 3
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: 10000
